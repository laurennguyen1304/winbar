[package]
name = "winbar"
version = "0.3.0"
description = "Notch-style quick panel for Windows"
authors = ["the owner"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "winbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: installing the Claude Code hook rewrites the user's settings.json, and its keys must stay in
# the order they were in (SPEC-claude-approvals §4.7).
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-drag = "2.1.1"

[target.'cfg(windows)'.dependencies]
# Same major as Tauri's own copy. Command bar: Windows Search (OLE DB), shell launch (SPEC-command-bar §3).
windows = { version = "0.61", features = [
  # Media widget: Windows media sessions (SPEC-media §3).
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  # Claude usage: one HTTPS GET without adding a TLS stack (SPEC-claude §4).
  "Win32_Networking_WinHttp",
  # Claude approvals: the named pipe between the hook relay and the running app, and who is on the other end of
  # it (SPEC-claude-approvals §3).
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  # Clipboard widget: format listener and clipboard formats (SPEC-clipboard §3).
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Search",
  # System widget: CPU times and memory (SPEC-system §3).
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# Claude drop: the `implement` macro behind the notch's drop target names this crate directly (SPEC-claude-drop
# §2). Same version `windows` already pulls in.
windows-core = "0.61"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
